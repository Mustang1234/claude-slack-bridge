# claude-slack-bridge — Slack 앱 매니페스트
#
# api.slack.com/apps → Create New App → From an app manifest 에서
# 이 파일 내용을 그대로 붙여넣으면 이름·권한이 한 번에 설정된다.
#
# 수신은 폴링(conversations.replies)이라 Socket Mode 도 Events API 도 쓰지 않는다.
# 그래서 봇 토큰(xoxb-) 하나만 있으면 되고, 공인 IP·포트 개방이 필요 없다.
display_information:
  name: Claude Bridge
  description: Claude Code 세션의 알림을 받고 답장을 돌려보낸다
  background_color: "#2b2d31"

features:
  bot_user:
    display_name: Claude Bridge
    always_online: false
  app_home:
    # 이게 없으면 봇과의 DM 하단에 "이 앱으로 메시지를 보내는 기능이 꺼져
    # 있습니다" 가 뜬다. 알림은 오는데 답장은 못 하는 반쪽이 되므로 켜 둔다.
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # 에이전트 등록. 이게 있어야 agents.sessions.setStatus / rename 을 부를 수 있다
  # (없으면 not_authorized). 스레드에 "작업 중" 로딩 표시, "사용자 개입 대기",
  # 세션 제목 같은 상태를 Web API 만으로 찍는다 — 이벤트 수신이 필요 없으므로
  # 폴링 구조 그대로 쓴다. 실측 2026-09-09: 무료 플랜 워크스페이스에서도 통과.
  # 정지 버튼만은 agent_session_stopped 이벤트 구독(=Socket Mode)이 있어야 뜬다.
  agent_view:
    agent_description: Claude Code 세션의 알림을 받고 답장을 돌려보낸다

oauth_config:
  scopes:
    bot:
      # 보내기
      - chat:write
      # 메시지·상태 표시의 발신자 이름·아이콘 덮어쓰기 (config 의 display_name 등).
      # 봇 프로필 이름은 첫 설치 때 굳어져 재설치로 안 바뀌므로 이쪽을 쓴다.
      - chat:write.customize
      # 에이전트 기능 (agent_view). 콘솔에서 Agents & AI Apps 를 켜면 자동으로 붙는
      # 것과 같은 스코프다.
      - assistant:write
      # 답장 읽기 — 채널 종류에 따라 필요한 쪽이 갈린다
      - channels:history
      - groups:history
      - im:history
      # 채널명 -> 채널 ID 조회 (설치 편의)
      - channels:read
      - groups:read
      # DM 으로 받고 싶을 때
      - im:write

settings:
  # 인바운드 연결을 일절 쓰지 않는다. 방화벽 뒤에서도 그대로 동작한다.
  socket_mode_enabled: false
  org_deploy_enabled: false
  token_rotation_enabled: false
